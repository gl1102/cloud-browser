# 免费云浏览器 - GitHub Actions workflow
# 用法：
# 1. 在 GitHub 建一个新仓库（公开仓库不限分钟数），把本文件放到 .github/workflows/cloud-browser.yml（必须在 main 分支）
# 2. 仓库页面点 Actions -> "Free Cloud Browser" -> Run workflow，填 VNC 密码 -> Run
# 3. 等 3~5 分钟（要装中文语言包和输入法），在这次运行的日志里找到 https://xxx.trycloudflare.com/vnc.html，浏览器打开
# 4. 点 Connect，输入 VNC 密码，就能用里面的 Chrome 了（中文界面）
# 5. 输入法：中英文两种，默认拼音；切换方式二选一：
#    - 桌面右键 -> "切换输入法 中/英"（手机上用这个，不用记快捷键）
#    - 键盘按 Ctrl+Space
# 6. 浏览器关掉了？在桌面上点右键 -> Google Chrome 就能重新打开
# 7. 不用时去 Actions 页面 Cancel 这次运行，省分钟数
#
# 说明：fluxbox 是轻量窗口管理器，没有桌面图标概念，所以"快捷方式"做成了
#       桌面右键菜单里的 Chrome 入口，效果一样。

name: Free Cloud Browser

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'VNC 连接密码（最多8位有效，用完即弃，别用常用密码）'
        required: true
      run_minutes:
        description: '本次运行时长（分钟，最多填 350）'
        required: false
        default: '300'

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub 单个 job 上限 6 小时
    steps:
      - name: 安装桌面环境（含中文语言包和输入法）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb tigervnc-scraping-server fluxbox websockify xterm language-pack-zh-hans fonts-wqy-microhei fcitx5 fcitx5-chinese-addons fcitx5-frontend-gtk3 fcitx5-frontend-gtk2 dbus-x11 > /dev/null 2>&1
          sudo locale-gen zh_CN.UTF-8 > /dev/null 2>&1
          echo "LANG=zh_CN.UTF-8" >> $GITHUB_ENV
          echo "LANGUAGE=zh_CN:zh" >> $GITHUB_ENV
          echo "GTK_IM_MODULE=fcitx" >> $GITHUB_ENV
          echo "QT_IM_MODULE=fcitx" >> $GITHUB_ENV
          echo "XMODIFIERS=@im=fcitx" >> $GITHUB_ENV
          git clone -q --depth 1 https://github.com/novnc/noVNC.git /tmp/noVNC

      - name: 下载 cloudflared（免注册的公网隧道）
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: 启动云浏览器
        run: |
          export DISPLAY=:99
          export GTK_IM_MODULE=fcitx QT_IM_MODULE=fcitx XMODIFIERS=@im=fcitx
          # D-Bus 会话总线（fcitx5 的输入法前端靠它和守护进程通信，没有它 Chrome 连不上输入法）
          eval $(dbus-launch --sh-syntax)
          # fcitx5 输入法配置：默认拼音，可用 Ctrl+Space 切换
          mkdir -p ~/.config/fcitx5
          {
          echo '[Groups/0]'
          echo 'Name=Default'
          echo 'Default Layout=us'
          echo 'DefaultIM=pinyin'
          echo ''
          echo '[Groups/0/Items/0]'
          echo 'Name=keyboard'
          echo 'Layout='
          echo ''
          echo '[Groups/0/Items/1]'
          echo 'Name=pinyin'
          echo 'Layout='
          echo ''
          echo '[GroupOrder]'
          echo '0=Default'
          } > ~/.config/fcitx5/profile
          # fluxbox 右键菜单：Chrome + 终端（关掉浏览器后从这里重开）
          mkdir -p ~/.fluxbox
          {
          echo '[begin] (Fluxbox)'
          echo '  [exec] (Google Chrome) {google-chrome --no-sandbox --disable-dev-shm-usage --disable-gpu --lang=zh-CN --window-size=1366,768}'
          echo '  [exec] (切换输入法 中/英) {fcitx5-remote -t}'
          echo '  [exec] (终端 Terminal) {xterm}'
          echo '  [separator]'
          echo '  [exit] (退出)'
          echo '[end]'
          } > ~/.fluxbox/menu
          # 虚拟显示器 + 输入法 + 轻量窗口管理器
          Xvfb :99 -screen 0 1366x768x24 > /tmp/xvfb.log 2>&1 &
          sleep 3
          fcitx5 -d > /tmp/fcitx5.log 2>&1
          sleep 2
          pgrep -a fcitx5 || echo "WARNING: fcitx5 未能启动，中文输入不可用，见 /tmp/fcitx5.log"
          fluxbox > /tmp/fluxbox.log 2>&1 &
          sleep 2
          # VNC 服务（带密码）
          # 用 TigerVNC 的 x0vncserver 代替 x11vnc：它支持 noVNC 的 UTF-8 扩展剪贴板，
          # 从浏览器外粘贴中文不会再变成问号（x11vnc 太老不支持，noVNC 会把中文硬转成 ?）
          mkdir -p ~/.vnc
          VNC_PASSWD=$(command -v vncpasswd || command -v tigervncpasswd)
          printf '%s' "${{ inputs.vnc_password }}" | "$VNC_PASSWD" -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          VNC_SERVER=$(command -v x0vncserver || command -v x0tigervncserver)
          "$VNC_SERVER" -display :99 -rfbport 5900 -rfbauth ~/.vnc/passwd -SecurityTypes VncAuth > /tmp/vncserver.log 2>&1 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/5900) 2>/dev/null && break; sleep 1; done
          # noVNC 网页客户端
          websockify --web=/tmp/noVNC 6080 localhost:5900 > /tmp/websockify.log 2>&1 &
          sleep 2
          # 启动 Chrome（用 runner 自带的，--lang=zh-CN 强制中文界面）
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          DISPLAY=:99 "$CHROME" --no-sandbox --disable-dev-shm-usage --disable-gpu --lang=zh-CN --window-size=1366,768 --window-position=0,0 > /tmp/chrome.log 2>&1 &
          sleep 3
          echo "浏览器已在虚拟桌面中启动（中文界面 + 中英文输入法，右键菜单可切换）"

      - name: 建立公网隧道（在下方日志里找访问地址）
        run: |
          /tmp/cloudflared tunnel --url http://127.0.0.1:6080 --no-autoupdate > /tmp/tunnel.log 2>&1 &
          echo "等待隧道地址生成..."
          for i in $(seq 1 60); do
            HOST=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1)
            if [ -n "$HOST" ]; then
              echo ""
              echo "=================================================="
              echo "  浏览器访问地址： ${HOST}/vnc.html"
              echo "  打开后点 Connect，输入你设置的 VNC 密码"
              echo "  输入法：桌面右键 -> 切换输入法 中/英（或按 Ctrl+Space）"
              echo "  浏览器关掉了？在桌面点右键 -> Google Chrome 重开"
              echo "  手机上建议点开后用双指缩放，体验好很多"
              echo "=================================================="
              echo ""
              break
            fi
            sleep 2
          done
          RUN_MINUTES="${{ inputs.run_minutes }}"
          echo "保持运行 ${RUN_MINUTES} 分钟（也可在 Actions 页面随时 Cancel 结束）"
          sleep $((RUN_MINUTES * 60))
